name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  app:
    name: App validation
    runs-on: ubuntu-latest
    env:
      CI_IMAGE_REF: aws-containerized-web-app:ci-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck app
        working-directory: app
        run: npm run typecheck

      - name: Test app
        working-directory: app
        run: npm test

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Build final container image
        run: docker build --file app/Dockerfile --tag "${CI_IMAGE_REF}" app

      - name: Run container smoke test
        working-directory: app
        env:
          CONTAINER_SMOKE_IMAGE: ${{ env.CI_IMAGE_REF }}
          CONTAINER_SMOKE_SKIP_BUILD: "true"
        run: npm run test:container

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: v0.71.2

      - name: Generate container SBOM and vulnerability report
        run: bash scripts/scan-container-image.sh "${CI_IMAGE_REF}"

      - name: Upload container security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            artifacts/container-sbom.cdx.json
            artifacts/container-vulnerabilities.json
          if-no-files-found: error
          retention-days: 14

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Set up Node.js for static checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Test Terraform plan contracts
        run: terraform test -no-color

      - name: Run Terraform static regression checks
        run: node scripts/terraform-static-check.mjs

      - name: Run CI static regression checks
        run: node scripts/ci-static-check.mjs

      - name: Run release static regression checks
        run: node scripts/release-static-check.mjs
