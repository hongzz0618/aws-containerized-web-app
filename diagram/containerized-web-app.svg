<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS containerized web application architecture</title>
  <desc id="desc">A user sends HTTP port 80 traffic to an internet-facing Application Load Balancer in public subnets. The load balancer forwards to an ECS Fargate Node.js application in private subnets on port 3000 and checks /health. The application sends logs to CloudWatch Logs and uses NAT Gateway for outbound access.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f8a43"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c06b00"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #d5dbe3; stroke-width: 1.5; }
      .vpc { fill: #fbfdff; stroke: #c9d3df; stroke-width: 1.5; }
      .az { fill: #ffffff; stroke: #e3e8ef; stroke-width: 1; stroke-dasharray: 6 6; }
      .public-layer { fill: #eef6ff; stroke: #cbd5e1; stroke-width: 1; }
      .private-layer { fill: #f4f8f3; stroke: #cbd5e1; stroke-width: 1; }
      .public-subnet { fill: #f8fbff; stroke: #d7e3f4; stroke-width: 1; }
      .private-subnet { fill: #fbfdf9; stroke: #d9e5d4; stroke-width: 1; }
      .card { fill: #ffffff; stroke-width: 1.5; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #232f3e; }
      .muted { fill: #667085; }
      .small { font-size: 12px; }
      .medium { font-size: 14px; }
      .service { font-size: 16px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 700; }
      .flow { fill: none; stroke: #344054; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-green { fill: none; stroke: #4f8a43; stroke-width: 1.7; marker-end: url(#arrow-green); }
      .dash-amber { fill: none; stroke: #c06b00; stroke-width: 1.7; stroke-dasharray: 7 7; marker-end: url(#arrow-amber); }
      .dash-slate { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 7; marker-end: url(#arrow-slate); }
      .dash-log { fill: none; stroke: #b7791f; stroke-width: 1.6; stroke-dasharray: 7 7; marker-end: url(#arrow-amber); }
      .caption-box { fill: #ffffff; stroke: none; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <rect x="250" y="55" width="1275" height="790" rx="8" class="boundary"/>
  <text x="272" y="88" class="label title">AWS Cloud</text>

  <rect x="320" y="155" width="1010" height="590" rx="8" class="vpc"/>
  <text x="342" y="188" class="label title">VPC</text>

  <rect x="375" y="229" width="430" height="465" rx="8" class="az"/>
  <rect x="845" y="229" width="430" height="465" rx="8" class="az"/>
  <text x="391" y="241" class="label small muted">Availability Zone A</text>
  <text x="861" y="241" class="label small muted">Availability Zone B</text>

  <rect x="355" y="250" width="940" height="180" rx="8" class="public-layer"/>
  <text x="371" y="277" class="label medium" font-weight="700">Public subnets</text>
  <rect x="385" y="290" width="375" height="110" rx="7" class="public-subnet"/>
  <text x="399" y="382" class="label small muted">Public subnet</text>
  <rect x="890" y="290" width="375" height="110" rx="7" class="public-subnet"/>
  <text x="904" y="382" class="label small muted">Public subnet</text>

  <rect x="355" y="500" width="940" height="180" rx="8" class="private-layer"/>
  <text x="371" y="527" class="label medium" font-weight="700">Private subnets</text>
  <rect x="385" y="540" width="375" height="110" rx="7" class="private-subnet"/>
  <text x="399" y="632" class="label small muted">Private subnet</text>
  <rect x="890" y="540" width="375" height="110" rx="7" class="private-subnet"/>
  <text x="904" y="632" class="label small muted">Private subnet</text>

  <rect x="580" y="310" width="340" height="70" rx="8" fill="#f4f0ff" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="613" cy="345" r="18" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="613" y="349" text-anchor="middle" class="label small" fill="#7c3aed" font-weight="700">ALB</text>
  <text x="750" y="339" text-anchor="middle" class="label service">Internet-facing ALB</text>
  <text x="750" y="361" text-anchor="middle" class="label small muted">HTTP listener :80</text>

  <rect x="1040" y="325" width="150" height="44" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text x="1115" y="352" text-anchor="middle" class="label medium" fill="#92400e" font-weight="700">NAT Gateway</text>

  <rect x="580" y="557" width="340" height="82" rx="8" fill="#f2f8ef" stroke="#8ab17d" stroke-width="1.5"/>
  <text x="750" y="585" text-anchor="middle" class="label service">ECS Service</text>
  <text x="750" y="607" text-anchor="middle" class="label medium">AWS Fargate task(s)</text>
  <text x="750" y="627" text-anchor="middle" class="label small muted">Desired count configurable</text>

  <rect x="945" y="562" width="245" height="72" rx="8" fill="#ffffff" stroke="#68a357" stroke-width="1.1"/>
  <text x="1067.5" y="592" text-anchor="middle" class="label medium" font-weight="700">Node.js application</text>
  <text x="1067.5" y="614" text-anchor="middle" class="label small muted">container port 3000</text>
  <text x="1067.5" y="664" text-anchor="middle" class="label small muted">No public IP</text>
  <text x="1067.5" y="682" text-anchor="middle" class="label small muted">No direct Internet access</text>

  <rect x="1375" y="285" width="150" height="78" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="1.5"/>
  <text x="1450" y="317" text-anchor="middle" class="label medium" font-weight="700">CloudWatch Logs</text>
  <text x="1450" y="339" text-anchor="middle" class="label small muted">/ecs/.../app</text>

  <rect x="60" y="385" width="125" height="62" rx="7" class="card" stroke="#94a3b8"/>
  <text x="122.5" y="422" text-anchor="middle" class="label medium" font-weight="700">Client</text>

  <rect x="60" y="640" width="145" height="64" rx="7" class="card" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="132.5" y="666" text-anchor="middle" class="label medium" font-weight="700">Container image</text>
  <text x="132.5" y="688" text-anchor="middle" class="label small muted">app_image_uri</text>

  <path d="M 185 416 H 520 V 345 H 580" class="flow"/>
  <rect x="300" y="397" width="78" height="25" rx="4" class="caption-box"/>
  <text x="339" y="415" text-anchor="middle" class="label medium" font-weight="700">HTTP :80</text>

  <path d="M 750 380 V 557" class="flow"/>
  <rect x="655" y="452" width="190" height="45" rx="4" class="caption-box"/>
  <text x="750" y="470" text-anchor="middle" class="label medium" font-weight="700">Target group :3000</text>
  <text x="750" y="491" text-anchor="middle" class="label medium" font-weight="700">Health check: /health</text>

  <path d="M 920 598 H 945" class="flow-green"/>
  <rect x="906" y="573" width="82" height="22" rx="4" fill="#fbfdf9" stroke="none"/>
  <text x="947" y="589" text-anchor="middle" class="label small" fill="#4b7f3f">container :3000</text>

  <path d="M 1068 562 V 428 H 1115 V 369" class="dash-amber"/>
  <rect x="1132" y="448" width="99" height="23" rx="4" class="caption-box"/>
  <text x="1181.5" y="465" text-anchor="middle" class="label small" fill="#92400e">outbound access</text>

  <path d="M 1190 598 H 1360 V 324 H 1375" class="dash-log"/>
  <rect x="1258" y="582" width="42" height="23" rx="4" class="caption-box"/>
  <text x="1279" y="599" text-anchor="middle" class="label small" fill="#8a5a14">logs</text>

  <path d="M 205 672 H 530 V 716 H 1068 V 634" class="dash-slate"/>
  <rect x="478" y="658" width="76" height="23" rx="4" class="caption-box"/>
  <text x="516" y="675" text-anchor="middle" class="label small" fill="#64748b">image pull</text>
</svg>
