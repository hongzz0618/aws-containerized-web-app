<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS containerized web application architecture</title>
  <desc id="desc">A client sends HTTP port 80 traffic to an internet-facing Application Load Balancer in public subnets. The load balancer forwards through a target group on port 3000 to an ECS Service running AWS Fargate task containers in private subnets, with health checks on /health. Application Auto Scaling adjusts service desired count, CloudWatch alarms watch ALB and ECS metrics, and the service sends logs to CloudWatch Logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263445"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .aws { fill: #ffffff; stroke: #d5dbe3; stroke-width: 1.6; }
      .vpc { fill: #fbfdff; stroke: #c9d3df; stroke-width: 1.6; }
      .public-layer { fill: #edf6ff; stroke: #cbd5e1; stroke-width: 1.2; }
      .private-layer { fill: #f2f8ef; stroke: #cbd5e1; stroke-width: 1.2; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .muted { fill: #586575; }
      .title { font-size: 21px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .service { font-size: 20px; font-weight: 700; }
      .subservice { font-size: 17px; font-weight: 700; }
      .detail { font-size: 17px; }
      .primary { fill: none; stroke: #263445; stroke-width: 2.8; marker-end: url(#arrow); }
      .secondary { fill: none; stroke: #b45309; stroke-width: 1.7; stroke-dasharray: 7 8; marker-end: url(#arrow-amber); }
      .caption { fill: #ffffff; stroke: none; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <rect x="120" y="45" width="1420" height="810" rx="10" class="aws"/>
  <text x="148" y="84" class="label title">AWS Cloud</text>

  <rect x="250" y="140" width="1045" height="670" rx="10" class="vpc"/>
  <text x="278" y="180" class="label title">VPC</text>

  <rect x="300" y="220" width="945" height="205" rx="9" class="public-layer"/>
  <text x="326" y="257" class="label section">Public subnets</text>

  <rect x="300" y="505" width="945" height="245" rx="9" class="private-layer"/>
  <text x="326" y="542" class="label section">Private subnets</text>

  <rect x="465" y="286" width="395" height="86" rx="9" fill="#f4f0ff" stroke="#a78bfa" stroke-width="1.7"/>
  <circle cx="508" cy="329" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="1.7"/>
  <text x="508" y="335" text-anchor="middle" class="label detail" fill="#7c3aed" font-weight="700">ALB</text>
  <text x="662.5" y="322" text-anchor="middle" class="label service">Internet-facing ALB</text>
  <text x="662.5" y="349" text-anchor="middle" class="label detail muted">HTTP listener :80</text>

  <rect x="980" y="298" width="190" height="62" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="1075" y="336" text-anchor="middle" class="label subservice" fill="#92400e">NAT Gateway</text>

  <rect x="500" y="540" width="575" height="185" rx="10" fill="#eaf4e7" stroke="#7fb06f" stroke-width="1.8"/>
  <text x="787.5" y="582" text-anchor="middle" class="label service">ECS Service</text>

  <rect x="535" y="625" width="515" height="80" rx="8" fill="#f7fbf5" stroke="#9fc493" stroke-width="1.4"/>
  <text x="605" y="672" class="label subservice">AWS Fargate</text>

  <rect x="720" y="640" width="305" height="54" rx="6" fill="#ffffff" stroke="#68a357" stroke-width="1.3"/>
  <text x="872.5" y="662" text-anchor="middle" class="label detail" font-weight="700">Node.js application</text>
  <text x="872.5" y="683" text-anchor="middle" class="label detail muted">Port 3000</text>

  <rect x="1328" y="230" width="195" height="82" rx="9" fill="#eef7ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1425.5" y="264" text-anchor="middle" class="label subservice">Application</text>
  <text x="1425.5" y="288" text-anchor="middle" class="label subservice">Auto Scaling</text>

  <rect x="1328" y="360" width="195" height="82" rx="9" fill="#fff8e6" stroke="#b7791f" stroke-width="1.6"/>
  <text x="1425.5" y="394" text-anchor="middle" class="label subservice">CloudWatch</text>
  <text x="1425.5" y="418" text-anchor="middle" class="label subservice">Alarms</text>

  <rect x="1328" y="490" width="195" height="82" rx="9" fill="#fff8e6" stroke="#b7791f" stroke-width="1.6"/>
  <text x="1425.5" y="524" text-anchor="middle" class="label subservice">CloudWatch</text>
  <text x="1425.5" y="548" text-anchor="middle" class="label subservice">Logs</text>

  <rect x="50" y="292" width="145" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="122.5" y="336" text-anchor="middle" class="label subservice">Client</text>

  <path d="M 195 329 H 465" class="primary"/>
  <rect x="285" y="307" width="98" height="28" rx="5" class="caption"/>
  <text x="334" y="328" text-anchor="middle" class="label detail" font-weight="700">HTTP :80</text>

  <path d="M 662.5 372 V 468 H 872.5 V 640" class="primary"/>
  <rect x="726" y="450" width="228" height="55" rx="5" class="caption"/>
  <text x="840" y="472" text-anchor="middle" class="label detail" font-weight="700">Target group :3000</text>
  <text x="840" y="495" text-anchor="middle" class="label detail" font-weight="700">Health check: /health</text>

  <path d="M 990 540 L 1075 360" class="secondary"/>
  <path d="M 1075 632 L 1328 531" class="secondary"/>
  <path d="M 1328 271 L 1075 582" class="secondary"/>
  <path d="M 860 329 H 1328 V 401" class="secondary"/>
  <path d="M 1075 632 H 1240 V 401 H 1328" class="secondary"/>
</svg>
